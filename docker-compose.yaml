# ──────────────────────────────────────────────────────────────────────────
# 로컬 실행용 compose — app + PostgreSQL + Redis
#
# 사용법:
#   cp .env.example .env        # 그 다음 .env 의 CHANGE_ME 를 실제 값으로 채운다
#   ./gradlew bootJar           # ⚠️ 이미지는 밖에서 빌드한 jar 를 복사만 한다 (Dockerfile 참고)
#   docker compose up --build
#
# API:     http://localhost:8080/blanken/swagger-ui.html
# DB 접속: localhost:5433 (pgAdmin 등). 로컬 PostgreSQL 의 5432 와 겹치지 않게 옮겨 두었다.
#
# 스키마는 앱 기동 시 Flyway 가 만든다. 시드 데이터는 자동으로 넣지 않는다 (운영과 같은 경로):
#   docker compose exec -T postgres psql -U user -d blanken < src/main/resources/data.sql
#
# 운영(AWS)용이 아니다 — 운영은 DB 가 RDS 로 빠지므로 구성이 달라진다.
# ──────────────────────────────────────────────────────────────────────────

services:

  app:
    build: .
    image: blanken:local
    ports:
      - "8080:8080"
    environment:
      # 컨테이너 안에서 localhost 는 app 컨테이너 자신이다 — 다른 컨테이너는 서비스 이름으로 찾는다.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-blanken}
      DB_USERNAME: ${POSTGRES_USER:-user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 를 설정하세요}
      # application.yaml 이 redis host 를 localhost 로 고정하고 있어 환경변수로 덮어쓴다 (relaxed binding).
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # `:?` — 값이 없으면 compose 가 기동 전에 이 메시지로 실패한다.
      # 비어 있는 채로 띄우면 Spring Security 가 기동 중에 덜 친절한 에러로 죽는다.
      JWT_SECRET: ${JWT_SECRET:?.env 에 JWT_SECRET 을 설정하세요}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:?.env 에 KAKAO_CLIENT_ID 를 설정하세요}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:?.env 에 KAKAO_CLIENT_SECRET 을 설정하세요}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:?.env 에 NAVER_CLIENT_ID 를 설정하세요}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:?.env 에 NAVER_CLIENT_SECRET 을 설정하세요}
    depends_on:
      # 기동 순서만이 아니라 "접속 가능"까지 기다린다.
      # DB 가 준비되기 전에 앱이 뜨면 Flyway 가 연결에 실패해 앱이 바로 종료된다.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    # Testcontainers(PostgresTestContainerConfig)와 같은 이미지 — 테스트와 로컬 실행의 DB 버전을 맞춘다.
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blanken}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 를 설정하세요}
    ports:
      - "5433:5432"
    volumes:
      # 컨테이너를 지워도 데이터가 남는다. 초기화하려면 `docker compose down -v`.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # 호스트 포트를 열지 않는다 — 앱은 내부 네트워크로 붙고, 호스트의 6379 는 이미 다른 redis 가 쓰고 있다.
    # 들여다볼 때는 `docker compose exec redis redis-cli`.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
