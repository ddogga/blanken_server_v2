spring:
  application:
    name: blanken

  # 로컬 시크릿 파일. 루트의 application-secret.yaml 에서 변수를 읽어 온다.
  # - optional: 이라 파일이 없으면 조용히 건너뛴다 → 운영·CI 에는 두지 않는다.
  # - OS 환경변수가 설정 파일보다 우선순위가 높으므로, 운영에서는 진짜 환경변수가 항상 이긴다.
  # - src/main/resources 가 아니라 **프로젝트 루트**에 두는 이유: 빌드 산출물(jar)에 섞여 들어가지 않게 하기 위해
  config:
    import: optional:file:./application-secret.yaml

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blanken}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-name: Kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
              - account_email

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-name: Naver
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
              - profile_image

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response   # 실제 id는 response 안에 중첩

app:
  jwt:
    secret: ${JWT_SECRET} # 서버가 JWT를 발급할 떄 사용할 서명키
    access-token-expiry: 30m
    refresh-token-expiry: 14d
  cors:
    allowed-origins: http://localhost:3000
  oauth2:
    authorized-redirect-uris: http://localhost:3000/oauth2/redirect   # 로그인 후 돌아갈 프론트 주소 허용 목록


# 실행 SQL 을 로그로 출력한다. show_sql 은 System.out 으로 바로 찍혀 로거를 우회하므로 쓰지 않는다.
# 개발 편의용 — 운영 프로파일에서는 끌 것.
logging:
  level:
    org.hibernate.SQL: debug                # 실행되는 SQL 문 (format_sql 로 줄바꿈 정렬됨)
    org.hibernate.orm.jdbc.bind: trace      # 바인딩되는 파라미터 값 (`?` 자리에 뭐가 들어갔는지)

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

server:
  servlet:
    context-path: /blanken
